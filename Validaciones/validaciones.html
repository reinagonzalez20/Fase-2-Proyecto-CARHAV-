<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validaciones</title>
<!-- CSS de Bootstrap (en <head>) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body {
      background-color: #74906E; /* Verde de fondo */
      min-height: 100vh; /* Que cubra toda la pantalla */
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

</style>
  
</head>
    
    <body>
<div  class="form-container">

            <!--Este es la carta del nombre-->
    <div class="card p-3 shadow w-75 mx-auto mt-5">
                <form class="row g-3 needs-validation" novalidate>
        <div class="col-md-6 position-relative">
            <label for="validationTooltip01" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="validationTooltip01" required>
            <div class="valid-tooltip">
            </div>
        </div>
            <!--La del apellido-->
        <div class="col-md-6 position-relative">
            <label for="validationTooltip02" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="validationTooltip02" required>
            <div class="valid-tooltip">
            
            </div>
        </div>
            <!--La de el user-->
        <div class="col-md-6 position-relative">
            <label for="validationTooltipUsername" class="form-label">Correo</label>
            <div class="input-group has-validation">
            <span class="input-group-text" id="validationTooltipUsernamePrepend">@</span>
            <input type="text" class="form-control" id="validationTooltipUsername" aria-describedby="validationTooltipUsernamePrepend" required>
            <div class="invalid-tooltip">
            
            </div>
            </div>
        </div>
            <!--La de la contraseña-->
            <div>
                <div class="col-md-6 position-relative"></div>
                <label for="inputPassword5" class="form-label">Contraseña</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">
            Tu contraseña debe de contener de 8-20 digitos, utilizando (número, signos, letras, mayusculas y minusculas).
            </div>
                <!--La de tu ciudad-->
            <div class="col-md-6 position-relative">
            <label for="validationTooltip03" class="form-label">Ciudad</label>
            <input type="text" class="form-control" id="validationTooltip03" required>
            <div class="invalid-tooltip">
            .....
            </div>
        </div>
          
            
        </div>
        
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Submit form</button>
        </div>
        </form>
    </div>
</div>

        <script>
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
        }, false);
    });
</script>

  
</body>
</html>
